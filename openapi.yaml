openapi: 3.0.4
info:
  title: SEC Filings
  description: >-
    SEC Filings returns the recent EDGAR filing history for a US public company
    by ticker - 10-K annual reports, 10-Q quarterlies, 8-K current reports, Form
    4 insider filings, S-1 registrations and more - each with its filing date,
    form type and a direct link to the document, plus derived filing-activity
    analytics calculated for you.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/secfilings:
    get:
      summary: SEC Filings
      description: >-
        Get the recent SEC EDGAR filing history for a company by ticker symbol.
        Optionally filter to a specific form type and limit the number of
        filings returned.
      operationId: secfilings
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
          example: AAPL
        - name: form
          in: query
          schema:
            type: string
          required: false
          description: Filter to a single form type (e.g. 10-K, 10-Q, 8-K, 4).
          example: 10-K
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: Number of filings to return (1-50). Defaults to 5.
          example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: AAPL
                  cik: '0000320193'
                  company: Apple Inc.
                  sic: '3571'
                  sicDescription: Electronic Computers
                  fiscalYearEnd: '0926'
                  totalRecentFilings: 1000
                  count: 5
                  latest:
                    annual:
                      form: 10-K
